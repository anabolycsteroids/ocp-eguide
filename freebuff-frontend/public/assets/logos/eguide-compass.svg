<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <circle cx="32" cy="32" r="30" stroke="#00a050" stroke-width="2" fill="none"/>
  <circle cx="32" cy="32" r="24" stroke="#00a050" stroke-width="1" opacity="0.3" fill="none"/>
  <!-- N/S/E/W ticks -->
  <line x1="32" y1="2" x2="32" y2="8" stroke="#00a050" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="56" x2="32" y2="62" stroke="#00a050" stroke-width="2" stroke-linecap="round"/>
  <line x1="2" y1="32" x2="8" y2="32" stroke="#00a050" stroke-width="2" stroke-linecap="round"/>
  <line x1="56" y1="32" x2="62" y2="32" stroke="#00a050" stroke-width="2" stroke-linecap="round"/>
  <!-- N arrow -->
  <polygon points="32,6 28,22 32,18 36,22" fill="#00a050"/>
  <!-- S arrow -->
  <polygon points="32,58 28,42 32,46 36,42" fill="#0a1628" opacity="0.4"/>
  <!-- E/W ticks -->
  <line x1="44" y1="32" x2="48" y2="32" stroke="#00a050" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="16" y1="32" x2="20" y2="32" stroke="#00a050" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#00a050"/>
  <!-- N letter -->
  <text x="32" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#00a050">N</text>
</svg>
